# Dat file nay o: .github/workflows/hourly.yml  (trong repo)
name: hourly-update

on:
  schedule:
    - cron: "7 * * * *"   # phut thu 7 moi gio (UTC); GitHub co the tre vai phut den vai chuc phut
  workflow_dispatch:       # cho phep bam nut chay tay

permissions:
  contents: write          # de workflow tu commit file ket qua

concurrency:
  group: hourly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Cap nhat du lieu va bien
        run: python live_update.py
        env:
          ETH_RPC_URL: ${{ secrets.ETH_RPC_URL }}
      - name: Luu ket qua vao repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live
          git diff --cached --quiet || (git commit -m "live update $(date -u +'%Y-%m-%d %H:%M') UTC" && git pull --rebase && git push)
